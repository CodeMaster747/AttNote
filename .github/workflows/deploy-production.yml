name: Deploy Production (Web)

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create .env from example
        run: cp .env.example .env

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Configure Firebase for production
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -x
          firebase --version
          firebase use ${{ vars.FIREBASE_PROD_PROJECT_ID }}

          # The project may have multiple Web apps (e.g. a leftover
          # Windows-as-Web entry from Flutter desktop setup). Pick the first
          # Web app whose display name does NOT contain "windows".
          APP_ID=$(firebase apps:list WEB --project=${{ vars.FIREBASE_PROD_PROJECT_ID }} --json \
            | jq -r '[.result[] | select((.displayName // "") | ascii_downcase | contains("windows") | not)][0].appId // empty')
          if [ -z "$APP_ID" ]; then
            echo "ERROR: no eligible Web app found in ${{ vars.FIREBASE_PROD_PROJECT_ID }}"
            firebase apps:list WEB --project=${{ vars.FIREBASE_PROD_PROJECT_ID }}
            exit 1
          fi
          echo "Using Web app: $APP_ID"

          firebase apps:sdkconfig WEB "$APP_ID" --project=${{ vars.FIREBASE_PROD_PROJECT_ID }} > firebase-config.json
          wc -c firebase-config.json
          python3 scripts/generate_firebase_options.py

      - name: Update OAuth Client ID
        run: |
          {
            echo "/// OAuth 2.0 **Web** client ID for attnote-prod"
            echo "///"
            echo "/// This is the Web client OAuth ID from Google Cloud Console."
            echo "/// Project: attnote-prod (621960649863)"
            echo "const String kGoogleOAuthWebClientId ="
            echo "    '621960649863-d1cq11hd0isuoa7tiandtejvt3scm8c6.apps.googleusercontent.com';"
          } > lib/config/google_oauth_web_client_id.dart
          echo "Updated OAuth client ID for production"

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting (production)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only hosting --project "${{ vars.FIREBASE_PROD_PROJECT_ID }}"
