name: Deploy Production (Web)

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Configure Firebase for production
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase use ${{ vars.FIREBASE_PROD_PROJECT_ID }}
          
          # Get Firebase web config
          firebase apps:sdkconfig WEB --project=${{ vars.FIREBASE_PROD_PROJECT_ID }} > firebase-config.json
          
          # Use Python to generate firebase_options.dart
          python3 << 'EOF'
import json

with open('firebase-config.json', 'r') as f:
    config = json.load(f)

api_key = config.get('apiKey', '')
app_id = config.get('appId', '')
messaging_sender_id = config.get('messagingSenderId', '')
project_id = config.get('projectId', '')
auth_domain = config.get('authDomain', '')
storage_bucket = config.get('storageBucket', '')
measurement_id = config.get('measurementId', '')

dart_code = f"""// File generated for Firebase project: {project_id}
// ignore_for_file: type=lint
import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
import 'package:flutter/foundation.dart'
    show defaultTargetPlatform, kIsWeb, TargetPlatform;

/// Default [FirebaseOptions] for use with your Firebase apps.
class DefaultFirebaseOptions {{
  static FirebaseOptions get currentPlatform {{
    if (kIsWeb) {{
      return web;
    }}
    switch (defaultTargetPlatform) {{
      case TargetPlatform.android:
      case TargetPlatform.iOS:
      case TargetPlatform.macOS:
      case TargetPlatform.windows:
      case TargetPlatform.linux:
        throw UnsupportedError(
          'DefaultFirebaseOptions have not been configured for this platform - '
          'you can reconfigure this by running the FlutterFire CLI again.',
        );
      default:
        throw UnsupportedError(
          'DefaultFirebaseOptions are not supported for this platform.',
        );
    }}
  }}

  static const FirebaseOptions web = FirebaseOptions(
    apiKey: '{api_key}',
    appId: '{app_id}',
    messagingSenderId: '{messaging_sender_id}',
    projectId: '{project_id}',
    authDomain: '{auth_domain}',
    storageBucket: '{storage_bucket}',"""

if measurement_id:
    dart_code += f"\n    measurementId: '{measurement_id}',"

dart_code += """
  );
}
"""

with open('lib/firebase_options.dart', 'w') as f:
    f.write(dart_code)

print("Generated firebase_options.dart")
print(dart_code)
EOF

      - name: Update OAuth Client ID
        run: |
          cat > lib/config/google_oauth_web_client_id.dart << 'EOF'
/// OAuth 2.0 **Web** client ID for attnote-prod
/// 
/// This is the Web client OAuth ID from Google Cloud Console.
/// Project: attnote-prod (621960649863)
const String kGoogleOAuthWebClientId =
    '621960649863-d1cq11hd0isuoa7tiandtejvt3scm8c6.apps.googleusercontent.com';
EOF
          echo "Updated OAuth client ID for production"

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting (production)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only hosting --project "${{ vars.FIREBASE_PROD_PROJECT_ID }}"
