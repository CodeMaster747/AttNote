name: Deploy Staging (Web)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Manual "Run workflow" defaults to the default branch (`main`), which may not
      # include Hosting config yet; staging deploys should use `develop`.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create .env from example
        run: cp .env.example .env

      - name: Inject Groq API key
        run: |
          # Replace the GROQ_API_KEY line with the secret (blank if unset, so
          # the app falls back to deterministic-only AI behavior).
          sed -i "s|^GROQ_API_KEY=.*|GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}|" .env

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Configure Firebase for staging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -x
          firebase --version
          firebase use ${{ vars.FIREBASE_STAGING_PROJECT_ID }}

          # The project may have multiple Web apps (e.g. a leftover
          # Windows-as-Web entry from Flutter desktop setup). Pick the first
          # Web app whose display name does NOT contain "windows".
          APP_ID=$(firebase apps:list WEB --project=${{ vars.FIREBASE_STAGING_PROJECT_ID }} --json \
            | jq -r '[.result[] | select((.displayName // "") | ascii_downcase | contains("windows") | not)][0].appId // empty')
          if [ -z "$APP_ID" ]; then
            echo "ERROR: no eligible Web app found in ${{ vars.FIREBASE_STAGING_PROJECT_ID }}"
            firebase apps:list WEB --project=${{ vars.FIREBASE_STAGING_PROJECT_ID }}
            exit 1
          fi
          echo "Using Web app: $APP_ID"

          firebase apps:sdkconfig WEB "$APP_ID" --project=${{ vars.FIREBASE_STAGING_PROJECT_ID }} > firebase-config.json
          wc -c firebase-config.json
          python3 scripts/generate_firebase_options.py

      - name: Update OAuth Client ID
        run: |
          {
            echo "/// OAuth 2.0 **Web** client ID for attnote-staging"
            echo "///"
            echo "/// This is the Web client OAuth ID from Google Cloud Console."
            echo "/// Project: attnote-staging (714889227250)"
            echo "const String kGoogleOAuthWebClientId ="
            echo "    '714889227250-vmo0qst7di9vtorsgh02v3cbtknsq57j.apps.googleusercontent.com';"
          } > lib/config/google_oauth_web_client_id.dart
          echo "Updated OAuth client ID for staging"

      - name: Build web
        run: flutter build web --release

      - name: Deploy hosting + rules (staging)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only hosting,firestore:rules,storage --project "${{ vars.FIREBASE_STAGING_PROJECT_ID }}"
