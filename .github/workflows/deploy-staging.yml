name: Deploy Staging (Web)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Manual "Run workflow" defaults to the default branch (`main`), which may not
      # include Hosting config yet; staging deploys should use `develop`.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Firebase CLI and FlutterFire CLI
        run: |
          npm install -g firebase-tools
          dart pub global activate flutterfire_cli

      - name: Setup service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

      - name: Configure Firebase for staging
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          flutterfire configure \
            --project=${{ vars.FIREBASE_STAGING_PROJECT_ID }} \
            --platforms=web,android \
            --yes \
            --out=lib/firebase_options.dart

      - name: Extract and update OAuth Client ID
        run: bash scripts/update_google_oauth_client_id.sh

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting (staging)
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only hosting --project "${{ vars.FIREBASE_STAGING_PROJECT_ID }}"
